name: CI/CD dev Branch

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint check
      run: npm run lint

    - name: Build check
      run: npm run build

    - name: Run tests (if available)
      run: npm test || echo "No tests configured"

  quality:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Security audit (moderate)
      run: npm audit --audit-level moderate

    - name: Check bundle size
      run: npm run build && npx @next/bundle-analyzer@latest .next/static/chunks/ || echo "Bundle analyzer not available"

    - name: Format check
      run: npm run format-check || echo "Prettier not configured"
